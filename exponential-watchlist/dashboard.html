  .co-sector { font-size: 11.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scorebar { height: 14px; display: flex; gap: 2px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
  .scorebar i { display: block; height: 100%; }
  .scorenum { text-align: right; }
  .scorenum .n { font-size: 18px; font-weight: 700; }
  .band { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em; }
  .body { padding: 4px 16px 16px; border-top: 1px solid var(--border); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .chip { background: var(--chip-bg); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--text-secondary); }
  .chip.fit-high { color: var(--elite); font-weight: 650; }
  .chip.fit-medium { color: var(--solid); font-weight: 650; }
  .chip.fit-low { color: var(--text-muted); font-weight: 650; }

  .grid2 .k { color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .note { font-size: 13px; color: var(--text-secondary); margin: 8px 0; }
  .note b { color: var(--text-primary); font-weight: 600; }
  ul.risks { margin: 6px 0 0 18px; font-size: 13px; color: var(--text-secondary); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em;

  td.num { font-weight: 650; }
  .muted { color: var(--text-muted); }
  footer { margin-top: 36px; font-size: 12.5px; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 14px; }

const bandColor = b => ({Elite:"--elite",Strong:"--strong",Solid:"--solid",Watch:"--watch",Weak:"--weak"}[b] || "--text-muted");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const v = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

document.getElementById("subtitle").textContent =
  `Companies fitting the exponential thesis that are not holdings — fundamentals scored on the company-health rubric v1.1. As of ${REG.as_of}. Informational only; never a recommendation.`;

const cos = REG.companies, bench = REG.bench || [];
const avg = Math.round(cos.reduce((a,c)=>a+c.score.total,0)/cos.length);
document.getElementById("stats").innerHTML = [
  [cos.length, "on the list"], [REG.cap - cos.length, "open slots"], [avg, "avg score"], [bench.length, "on the bench"]
].map(([n,l]) => `<div class="stat"><div class="v">${n}</div><div class="l">${l}</div></div>`).join("");

// rail coverage line (a name can span multiple rails)
const RAILS = ["compute","energy","biology","manufacturing"];
const railCounts = RAILS.map(r => `${r} ${cos.filter(c => (c.thesis_fit.themes||[]).includes(r)).length}`).join(" · ");
document.getElementById("stats").insertAdjacentHTML("afterend",
  `<div class="h2sub" style="margin-top:2px">Rail coverage on the list: ${railCounts}. Holdings are excluded by design — much of the energy rail (GEV, VRT, CEG, ETN, CCJ) already lives in company-health.</div>`);

document.getElementById("pillarLegend").innerHTML =
  PILLARS.map(([k,l,c]) => `<span><i style="background:var(${c})"></i>${l}</span>`).join("");

function scorebar(c) {
  return `<div class="scorebar" role="img" aria-label="score ${c.score.total} of 100">` + PILLARS.map(([k,l,cc]) => {
    const s = c.score.subscores[k];
    return `<i style="width:${s.points}%;background:var(${cc})" data-tip="${l}: ${s.points}/${s.max}"></i>`;
  }).join("") + `</div>`;
}

document.getElementById("list").innerHTML = cos.map(c => {
  const mc = c.market_context || {};
  const rank = k => mc[k] && mc[k].rank ? mc[k].rank : "—";
  const val = (k, suf) => mc[k] && mc[k].value != null ? mc[k].value + suf : "n/a";
  return `<details class="co">
  <summary>
    <div><div class="tick">${esc(c.ticker)}</div></div>
    <div><div class="co-name">${esc(c.name)}</div><div class="co-sector">${esc(c.sector)}</div></div>
    <div class="scorebar-wrap">${scorebar(c)}</div>
    <div class="scorenum"><div class="n">${c.score.total}</div><div class="band" style="color:var(${bandColor(c.score.band)})">${c.score.band}</div></div>
  </summary>
  <div class="body">

      <div><div class="k">Gross margin</div>${val("gross_margin","%")} · ${rank("gross_margin")}</div>
      <div><div class="k">FCF margin (TTM)</div>${val("fcf_margin","%")} · ${rank("fcf_margin")}</div>
    </div>
    <div class="note"><b>Why it fits the thesis.</b> ${esc(c.thesis_fit.note)}</div>
    <div class="note"><b>Moat (${c.moat.rating_1to5}/5).</b> ${esc(c.moat.note)}</div>
    <div class="note"><b>Margins.</b> ${esc(c.margins.trend_note)}</div>
    <div class="note"><b>Guidance.</b> ${esc(c.guidance_note)}</div>

const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if (t) { tip.textContent = t.dataset.tip; tip.style.opacity = 1;
    tip.style.left = Math.min(e.clientX + 12, innerWidth - 160) + "px"; tip.style.top = (e.clientY + 14) + "px"; }
  else tip.style.opacity = 0;
});
